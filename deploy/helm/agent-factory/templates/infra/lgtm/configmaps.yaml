{{- /* Grafana settings, dashboard provider, start script and dashboards of the LGTM pod. Datasources (uid
       prometheus / loki / tempo) come pre-provisioned with the grafana/otel-lgtm image.
       grafana-start replaces the image's run-grafana.sh, which exports anonymous Admin access: admin and viewer
       logins come from secrets.infra (grafana-admin-*, grafana-viewer-*). Dashboards: files/dashboards/*.json. */ -}}
{{- if .Values.infra.lgtm.enabled }}
{{ include "ats.configMap" (dict "root" $ "name" "grafana-settings" "namespace" .Values.infra.namespace "partOf" .Values.infra.namespace "appName" "lgtm" "data" .Values.infra.lgtm.grafanaSettings) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "ats.infraMetadata" (dict "root" $ "name" "grafana-provisioning" "appName" "lgtm") | nindent 2 }}
data:
  agent-factory.yaml: |
    apiVersion: 1
    providers:
      - name: agent-factory
        folder: ATS
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/ats-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "ats.infraMetadata" (dict "root" $ "name" "grafana-start" "appName" "lgtm") | nindent 2 }}
data:
  {{- dict "run-grafana.sh" (.Files.Get "files/grafana/run-grafana.sh") | toYaml | nindent 2 }}
---
{{- $dashboards := dict }}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
{{- $_ := set $dashboards (base $path) ($.Files.Get $path) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "ats.infraMetadata" (dict "root" $ "name" "grafana-dashboards" "appName" "lgtm") | nindent 2 }}
data:
  {{- toYaml $dashboards | nindent 2 }}
---
{{- /* Retention. The otel-lgtm image runs Prometheus with no retention flag, Loki with no compactor and Tempo
       with its 14-day default, all on one emptyDir - so /data grows until the kubelet evicts the pod and the
       whole observability stack goes down together. These three files replace the image's, keeping its own
       settings and adding only the expiry, from infra.lgtm.retention. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "ats.infraMetadata" (dict "root" $ "name" "lgtm-retention" "appName" "lgtm") | nindent 2 }}
data:
  {{- $retention := .Values.infra.lgtm.retention }}
  {{- dict
        "run-prometheus.sh" (.Files.Get "files/lgtm/run-prometheus.sh")
        "loki-config.yaml" (.Files.Get "files/lgtm/loki-config.yaml" | replace "RETENTION_PERIOD_PLACEHOLDER" $retention)
        "tempo-config.yaml" (.Files.Get "files/lgtm/tempo-config.yaml" | replace "RETENTION_PERIOD_PLACEHOLDER" $retention)
      | toYaml | nindent 2 }}
{{- end }}
