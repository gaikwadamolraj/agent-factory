# DOCUMENTATION ONLY - never rendered by the chart, never commit real values.
# Secret `agent-factory-secrets` in namespace `agent-factory` (chart value: secrets.platform), read by the ATS
# services, the schema Job and KEDA. This holds ONLY application secrets plus the connection details the apps need
# to reach the shared infrastructure. Raw infrastructure passwords live in agent-infra-secrets, NOT here.
# Create it once after `./deploy.sh init`: fill a private copy and `kubectl apply -f` it, or use
# `./deploy.sh init --generate-secrets` to create the generated keys for you without printing them.
#
# Why a few values still appear in both Secrets: a pod can only read a Secret in its OWN namespace, so a credential
# that an app in ats-platform needs to reach infra in agent-infra must exist in both. These are the ONLY copies, and
# deploy.sh checks they match (without printing values):
#   - the password INSIDE database-url / redis-url == agent-infra postgres-password / redis-password
#   - falkordb-password                            == agent-infra falkordb-password   (agent-knowledge-graph connects to it)
#   - llm-gateway-key                              == agent-infra master-key          (the services call the gateway with it)
# Hosts are the in-cluster FQDNs of the agent-infra services, so both the apps and the KEDA operator (which runs in
# its own namespace) can resolve them.
apiVersion: v1
kind: Secret
metadata:
  name: agent-factory-secrets
  namespace: agent-factory
type: Opaque
stringData:
  # Postgres connection the apps, the schema Job AND KEDA use (plain postgresql://; the apps add the async driver).
  database-url: "postgresql://REPLACE_USER:REPLACE_PASSWORD@postgres.agent-infra.svc.cluster.local:5432/ats_platform"
  # The one platform Redis. The knowledge graph switches to database 0 itself (REDIS_DB); others use the db given here.
  redis-url: "redis://:REPLACE_REDIS_PASSWORD@redis.agent-infra.svc.cluster.local:6379/1"
  # agent-knowledge-graph(-worker): FalkorDB password (same value as agent-infra falkordb-password).
  falkordb-password: "REPLACE-WITH-the-falkordb-password-of-agent-infra-secrets"
  # The key the services send to the LLM gateway (same value as agent-infra master-key).
  llm-gateway-key: "REPLACE-WITH-the-master-key-of-agent-infra-secrets"
  # auth-service signing key: PEM of an EC P-256 private key (ES256). `init --generate-secrets` creates it, or:
  #   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
  auth-signing-key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE-WITH-THE-GENERATED-KEY
    -----END PRIVATE KEY-----
  # optional, only during a key rotation: the previous signing key (its public key stays in the JWKS).
  # auth-signing-key-previous: |
  # client_credentials secrets, one per calling service (openssl rand -hex 32). Read by the caller
  # (SERVICE_CLIENT_SECRET) and by auth-service (CLIENT_SECRET_<CALLER>). One per services.authService.oauthClients.
  client-secret-ats-orchestrator: "REPLACE-WITH-openssl-rand-hex-32"
  client-secret-ats-orchestrator-onboarding: "REPLACE-WITH-openssl-rand-hex-32"
  client-secret-ats-orchestrator-bulk-match: "REPLACE-WITH-openssl-rand-hex-32"
  client-secret-agent-knowledge-graph: "REPLACE-WITH-openssl-rand-hex-32"
  client-secret-registry-service: "REPLACE-WITH-openssl-rand-hex-32"
  client-secret-agent-document: "REPLACE-WITH-openssl-rand-hex-32"
  client-secret-agent-skill: "REPLACE-WITH-openssl-rand-hex-32"
  # auth-service invite tokens: HMAC key signing the invite links (openssl rand -hex 32). `init --generate-secrets`
  # creates it; the service starts without it but the admin invite flow fails until it is set.
  invite-signing-key: "REPLACE-WITH-openssl-rand-hex-32"
  # auth-service password pepper (OPTIONAL): only needed once LOGIN_PEPPER_CURRENT_VERSION >= 1. Leave commented
  # until then. Rotate by adding login-pepper-v2, ... and raising the version (old hashes upgrade on next login).
  # login-pepper-v1: "REPLACE-WITH-openssl-rand-hex-32"
  # optional: agent-guardrail Hugging Face token for gated models.
  hf-key: ""
