# DOCUMENTATION ONLY - never rendered by the chart, never commit real values.
# Secret `agent-infra-secrets` in namespace `agent-infra` (chart value: secrets.infra).
# This is the SOURCE OF TRUTH for every infrastructure credential. The infra pods (postgres, redis, falkordb,
# llm-gateway, lgtm) all live in agent-infra and read their passwords here. The ATS services live in the other
# namespace and never read this Secret directly - they connect through the URLs in secret.example.agent-factory.yaml.
# Create it once after `./deploy.sh init`: fill a private copy and `kubectl apply -f` it.
apiVersion: v1
kind: Secret
metadata:
  name: agent-infra-secrets
  namespace: agent-infra
type: Opaque
stringData:
  # postgres: the superuser created on first start of an empty data volume, and its first database.
  postgres-user: "REPLACE_USER"
  postgres-password: "REPLACE_PASSWORD"
  postgres-db: "ats_platform"
  # redis: the one Redis of the platform (cache + the knowledge-graph semantic cache).
  redis-password: "REPLACE-WITH-openssl-rand-hex-24"
  # falkordb: the knowledge-graph store.
  falkordb-password: "REPLACE-WITH-openssl-rand-hex-24"
  # llm-gateway (LiteLLM): master-key = the admin key the ATS services send to call the gateway; backend keys.
  master-key: "sk-REPLACE-WITH-openssl-rand-hex-24"
  lmstudio-api-key: "lm-studio"           # LM Studio accepts any value
  vllm-qwen3-4b-api-key: "none"           # any value unless vLLM runs with --api-key
  # pgbouncer (optional, only with infra.pgbouncer.enabled AND infra.pgbouncer.authUser set): the password of the
  # low-privilege lookup role PgBouncer authenticates clients with (auth_query). It is NOT the superuser password -
  # that one must never reach the pooler. Create the role and the lookup function first: docs/impl_pgbouncer.md.
  pgbouncer-auth-password: "REPLACE-WITH-openssl-rand-hex-24"
  # lgtm: Grafana logins (optional; without an admin password the admin sign-in stays locked).
  grafana-admin-user: "REPLACE_ADMIN"
  grafana-admin-password: "REPLACE-WITH-strong-password"
  grafana-viewer-user: "REPLACE_VIEWER"
  grafana-viewer-password: "REPLACE-WITH-password"
#
# CrowdSec bouncer key is NOT in this Secret: it lives in a DEDICATED Secret `crowdsec-bouncer` (key `api-key`) that
# must exist in BOTH agent-infra (the LAPI registers the bouncer) and kube-system (Traefik's plugin reads it as a
# file). The chart never renders the key. Create it only when enabling CrowdSec - see docs/gateway_security.md §5c:
#   kubectl -n agent-infra  create secret generic crowdsec-bouncer --from-literal=api-key='<KEY>'
#   kubectl -n kube-system  create secret generic crowdsec-bouncer --from-literal=api-key='<KEY>'
