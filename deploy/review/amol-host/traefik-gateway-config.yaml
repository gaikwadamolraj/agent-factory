# Traefik static config for the shared host, as a k3s HelmChartConfig (Traefik is k3s's own chart, outside
# ours). Apply once per cluster, then roll Traefik:
#
#   kubectl apply -f deploy/review/amol-host/traefik-gateway-config.yaml
#   kubectl -n kube-system rollout status deploy/traefik
#
# This file is the MINIMUM the chart's routing needs:
#   1. allowCrossNamespace - the IngressRoutes live in agent-infra but point at Services in agent-factory.
#      Without it Traefik refuses the reference, the routers never register, and the UIs 404 or fall through
#      to whatever else claims the host.
#   2. the Coraza WAF plugin (OWASP CRS) - referenced by the waf Middleware when infra.routing.waf.enabled=true.
#      Declaring a plugin costs nothing until a Middleware uses it.
#
# CrowdSec is NOT here. It needs extra volumes and a `crowdsec-bouncer` Secret, and a missing Secret leaves the
# Traefik pod stuck in ContainerCreating - which would make the behavioural IPS a prerequisite for having any
# routing at all. It is opt-in and lives in traefik-crowdsec-config.yaml; apply that one too when you turn
# infra.routing.crowdsec.enabled on.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    experimental:
      plugins:
        # The plugin name must match the spec.plugin.<name> the chart's Middlewares use. Pin to a real
        # release (check the plugin's GitHub releases for the current version).
        coraza:
          moduleName: github.com/jptosso/coraza-traefik
          version: v0.2.2
