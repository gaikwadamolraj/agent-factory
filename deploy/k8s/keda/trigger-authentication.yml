# Database credentials KEDA uses to count the queue. Read from ats-platform-secrets by the KEDA operator; never
# copied into the ScaledObject. Same login as the services (postgres-user / postgres-password).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ats-knowledge-worker-postgres
spec:
  secretTargetRef:
    - parameter: userName
      name: ats-platform-secrets
      key: postgres-user
    - parameter: password
      name: ats-platform-secrets
      key: postgres-password
