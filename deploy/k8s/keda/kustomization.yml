# KEDA autoscaling for the knowledge worker, as a kustomize Component: an overlay opts in with
#   components:
#     - ../../keda
# Requires the KEDA operator in the cluster (see README.md). Without this component the worker runs 1 fixed replica.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - trigger-authentication.yml
  - scaled-object.yml
patches:
  - path: worker-replicas-patch.yml
    target:
      kind: Deployment
      name: ats-knowledge-worker
