# Schema Job for prod: migrations only (no demo data).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ats-platform
resources:
  - ../../../base/dependencies
  - ../../../base/schema
images:
  - name: ats-schema
    newName: registry.example.com/ats/ats-schema
    newTag: "0.2.0"
patches:
  - target:
      kind: ConfigMap
      name: ats-schema-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: "PROD"
