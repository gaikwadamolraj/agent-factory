# Dev-specific settings (strategic merge into the base ConfigMaps).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-orchestrator-config
data:
  APP_ENV: "DEV"
  LOG_LEVEL: "INFO"
  COOKIE_SECURE: "false"       # dev ingress is plain http; keep "true" (base default) behind TLS
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-agent-config
data:
  APP_ENV: "DEV"
  LOG_LEVEL: "INFO"
