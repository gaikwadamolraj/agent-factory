# Dev overlay: namespace ats-platform, APP_ENV=DEV, ingress for the UI and Grafana.
# deploy.sh renders this and replaces the image tags with the freshly built ones.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ats-platform
resources:
  - ../../base
  - ingress.yml
components:
  - ../../keda      # KEDA autoscaling of the knowledge worker (needs the KEDA operator, see keda/README.md)
patches:
  - path: config-patch.yml
