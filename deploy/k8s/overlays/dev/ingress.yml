# UI under /ats and Grafana under /grafana on the shared host. No root route, no redirect: every other path keeps
# going to the existing ingresses in namespace amol.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ats-platform
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      ats-platform-ats-security-headers@kubernetescrd,
      ats-platform-ats-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: amol.rackspire.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ats-frontend
                port:
                  name: http
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: ats-lgtm
                port:
                  name: grafana
---
# Stricter limits for two endpoints on the same host and backend (the general limit above still covers the rest).
# High priority so these win over the "/" ingress route; paths are under the UI base path /ats.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ats-platform-limited
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`amol.rackspire.ai`) && PathPrefix(`/ats/api/backend/v1/auth/`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: ats-security-headers
        - name: ats-rate-limit-auth
      services:
        - name: ats-frontend
          port: http
    - match: Host(`amol.rackspire.ai`) && Method(`POST`) && PathRegexp(`^/ats/api/backend/v1/chats/[^/]+/messages$`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: ats-security-headers
        - name: ats-rate-limit-turns
      services:
        - name: ats-frontend
          port: http
