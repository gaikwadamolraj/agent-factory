# ats-llm-config: the LLM settings every service reads (ats_common.llm). Generated with a content hash in its name,
# so any change here rolls agent, orchestrator, knowledge and the knowledge worker automatically on the next deploy
# (no pod keeps an old model by accident).
#
#   LLM_MODEL_*          gateway alias per purpose (the gateway decides which real model serves it)
#   LLM_PROFILES         profile -> {purpose: alias} overrides
#   LLM_CLIENT_PROFILES  client id -> profile: the per-client model policy (here: globex = high-quality)
#   LLM_CONFIG_VERSION   bump when the models behind the aliases change (part of every LLM cache key)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: ats-llm-config
    literals:
      - LLM_GATEWAY_URL=http://ats-llm-gateway/v1
      - LLM_CONFIG_VERSION=1
      - LLM_MODEL_CHAT=ats-chat
      - LLM_MODEL_SCREENING=ats-screening
      - LLM_MODEL_EXTRACTION=ats-extraction
      - LLM_MODEL_ANSWER=ats-answer
      - LLM_MODEL_EMBEDDING=ats-embedding
      - LLM_PROFILES={"high-quality":{"chat":"ats-chat-quality","answer":"ats-answer-quality","extraction":"ats-extraction-quality"}}
      - LLM_CLIENT_PROFILES={"2":"high-quality"}
      - LLM_EMBEDDING_ID=text-embedding-nomic-embed-text-v1.5@q8_0
      - LLM_EMBEDDING_DIM=768
      - LLM_TIMEOUT_S=1800
      - LLM_MAX_OUTPUT_TOKENS=4096
