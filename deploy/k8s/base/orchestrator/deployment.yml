# Orchestrator API (FastAPI /api/v1 + LangGraph assistant) - Deployment + Service.
# One replica per LM Studio host: the LLM request queue and running turns live in-process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-orchestrator
  labels:
    app.kubernetes.io/name: ats-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: orchestrator
          image: ats-orchestrator:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: ats-orchestrator-config
            - configMapRef:
                name: ats-llm-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: redis-url
            - name: LLM_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: ats-llm-gateway-secrets
                  key: master-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ats-orchestrator
  labels:
    app.kubernetes.io/name: ats-orchestrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ats-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: http
