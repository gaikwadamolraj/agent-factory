# FalkorDB: graph store of the knowledge service (one graph per namespace + client + project).
# StatefulSet with a persistent volume (AOF persistence on). Browser UI disabled. Password from ats-platform-secrets
# (key falkordb-password). Only the knowledge pods may connect (network-policy.yml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ats-falkordb
  labels:
    app.kubernetes.io/name: ats-falkordb
spec:
  serviceName: ats-falkordb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-falkordb
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: falkordb
          image: falkordb/falkordb:v4.22.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: BROWSER
              value: "0"
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: falkordb-password
            - name: REDIS_ARGS
              value: "--requirepass $(FALKORDB_PASSWORD) --appendonly yes --maxmemory-policy noeviction"
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ats-falkordb
  labels:
    app.kubernetes.io/name: ats-falkordb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ats-falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: redis
