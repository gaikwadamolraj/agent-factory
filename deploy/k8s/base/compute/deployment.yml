# Compute agent (MCP server, cluster-internal only) - Deployment + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-compute
  labels:
    app.kubernetes.io/name: ats-compute
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-compute
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-compute
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: compute
          image: ats-compute:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: ats-compute-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ats-compute
  labels:
    app.kubernetes.io/name: ats-compute
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ats-compute
  ports:
    - name: http
      port: 80
      targetPort: http
