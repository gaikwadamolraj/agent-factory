# Non-secret settings of the compute agent (runs caller-written code in ats-sandbox). JWT_SECRET comes from
# ats-platform-secrets (see deployment.yml); it needs no database, Redis or LLM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-compute-config
  labels:
    app.kubernetes.io/name: ats-compute
data:
  APP_ENV: "DEV"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://ats-lgtm:4318"
  SANDBOX_URL: "http://ats-sandbox"
  SANDBOX_RUN_TIMEOUT_S: "10"
  ALLOWED_CALLERS: "ats-orchestrator"
  TOOL_POLICY: "ats-orchestrator=execute_code|cancel_request"
