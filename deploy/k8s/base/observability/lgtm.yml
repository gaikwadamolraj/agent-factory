# Grafana LGTM (OTel collector + Prometheus + Loki + Tempo + Grafana in one pod) - Deployment + Service.
# Services send OTLP/HTTP to http://ats-lgtm:4318. Grafana is served under /grafana.
# Data lives on an emptyDir (dev); use a PersistentVolumeClaim for retention across restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-lgtm
  labels:
    app.kubernetes.io/name: ats-lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.8.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          envFrom:
            - configMapRef:
                name: ats-grafana-settings
          env:   # Grafana logins (optional keys; without an admin password the admin sign-in stays locked)
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: grafana-admin-user
                  optional: true
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: grafana-admin-password
                  optional: true
            - name: GRAFANA_VIEWER_USER
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: grafana-viewer-user
                  optional: true
            - name: GRAFANA_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: grafana-viewer-password
                  optional: true
          volumeMounts:
            - name: start
              mountPath: /otel-lgtm/run-grafana.sh
              subPath: run-grafana.sh
            - name: provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/ats-platform.yaml
              subPath: ats-platform.yaml
            - name: dashboards
              mountPath: /var/lib/ats-dashboards
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: grafana
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: start
          configMap:
            name: ats-grafana-start
            defaultMode: 0755
        - name: provisioning
          configMap:
            name: ats-grafana-provisioning
        - name: dashboards
          configMap:
            name: ats-grafana-dashboards
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ats-lgtm
  labels:
    app.kubernetes.io/name: ats-lgtm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ats-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
