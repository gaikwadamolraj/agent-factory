# Aliases for shared infrastructure that lives in namespace amol. They let the secret's short hostnames
# (postgres-service, redis-service) resolve from namespace ats-platform without changing the secret.
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app.kubernetes.io/name: postgres-alias
spec:
  type: ExternalName
  externalName: postgres-service.amol.svc.cluster.local
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app.kubernetes.io/name: redis-alias
spec:
  type: ExternalName
  externalName: redis-service.amol.svc.cluster.local
  ports:
    - name: redis
      port: 6379
