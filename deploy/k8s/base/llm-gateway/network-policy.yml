# Only the platform services that use LLMs may call the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ats-llm-gateway-callers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ats-llm-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ats-agent
                  - ats-orchestrator
                  - ats-knowledge
                  - ats-knowledge-worker
      ports:
        - protocol: TCP
          port: 4000
