# TEMPLATE ONLY - never commit real values. Create the real Secret once (values from your password manager):
#
#   kubectl -n ats-platform create secret generic ats-llm-gateway-secrets \
#     --from-literal=master-key="sk-$(openssl rand -hex 24)" \
#     --from-literal=lmstudio-api-key=lm-studio \
#     --from-literal=vllm-qwen3-4b-api-key=none
#
# or fill this file in a private copy and `kubectl apply -f` it. Kustomize does not apply this file.
#
# Keys:
#   master-key              gateway key: LiteLLM admin key and the key the services send (LLM_GATEWAY_KEY)
#   lmstudio-api-key        LM Studio backend (accepts any value)
#   vllm-qwen3-4b-api-key   vLLM backend on 192.168.0.120 (any value unless started with --api-key)
#   <provider>-api-key      add one per hosted provider you enable in litellm-config.yaml (e.g. anthropic-api-key)
apiVersion: v1
kind: Secret
metadata:
  name: ats-llm-gateway-secrets
  namespace: ats-platform
type: Opaque
stringData:
  master-key: "sk-REPLACE-WITH-openssl-rand-hex-24"
  lmstudio-api-key: "lm-studio"
  vllm-qwen3-4b-api-key: "none"
