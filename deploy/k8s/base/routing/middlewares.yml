# Traefik middlewares managed by this repo (referenced as ats-platform-<name>@kubernetescrd).
# Names start with "ats-" so applying never overwrites the manually created middlewares in this namespace
# (see deploy/k8s/README.md -> Middlewares for the duplicates and why these are used for the UI routes).
# No 'buffering' middleware: it also buffers responses and would break the streamed (SSE) chat answers.
# Upload size is enforced by the frontend proxy (413) and the orchestrator (FILE-LIM-0001).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ats-security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    contentSecurityPolicy: >-
      default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ats-rate-limit
spec:
  rateLimit:
    average: 20
    burst: 40
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 2
---
# Login / refresh / logout: 10 per minute per client IP (brute force; the app also locks a username after 5 failures)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ats-rate-limit-auth
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 10
    sourceCriterion:
      ipStrategy:
        depth: 2
---
# Sending a chat turn (screening / LLM work): 10 per minute per client IP, short bursts of 5.
# Per IP, not per user: keep it generous for offices behind one NAT address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ats-rate-limit-turns
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 5
    sourceCriterion:
      ipStrategy:
        depth: 2
