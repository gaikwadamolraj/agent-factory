# Only the orchestrator may call the knowledge MCP server. Add a podSelector entry here (and the caller to
# ALLOWED_CALLERS / TOOL_POLICY in config.yml) when another service starts using the knowledge graph.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ats-knowledge-callers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ats-knowledge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ats-orchestrator
      ports:
        - protocol: TCP
          port: 8002
