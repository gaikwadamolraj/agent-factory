# Knowledge MCP server (process ats-knowledge): ingest (queues only), episode status, search, forget.
# Deployment + ClusterIP Service. The worker is in ../knowledge-worker. Both share ConfigMap ats-knowledge-config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-knowledge
  labels:
    app.kubernetes.io/name: ats-knowledge
    app.kubernetes.io/component: knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-knowledge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-knowledge
        app.kubernetes.io/component: knowledge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: knowledge
          image: ats-knowledge:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: ats-knowledge-config
            - configMapRef:
                name: ats-llm-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: jwt-secret
            - name: LLM_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: ats-llm-gateway-secrets
                  key: master-key
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: falkordb-password
            - name: KNOWLEDGE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: knowledge-redis-password
            - name: REDIS_URL
              value: "redis://:$(KNOWLEDGE_REDIS_PASSWORD)@ats-knowledge-redis:6379/0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ats-knowledge
  labels:
    app.kubernetes.io/name: ats-knowledge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ats-knowledge
  ports:
    - name: http
      port: 80
      targetPort: http
