# Frontend (Next.js, served under /ats) - Deployment + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-frontend
  labels:
    app.kubernetes.io/name: ats-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: ats-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ats-frontend-config
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ats-frontend
  labels:
    app.kubernetes.io/name: ats-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ats-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
