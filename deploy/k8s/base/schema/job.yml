# Schema migration Job: create database -> alembic upgrade head -> (optional) seed. Safe to re-run.
# Run it with ./deploy.sh schema (deletes the previous Job first; Job specs are immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: ats-schema-migrate
  labels:
    app.kubernetes.io/name: ats-schema
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-schema
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: schema
          image: ats-schema:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - ats_schema
          args:
            - all
          envFrom:
            - configMapRef:
                name: ats-schema-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
