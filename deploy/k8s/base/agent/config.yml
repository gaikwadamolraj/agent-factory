# Non-secret settings of the screening agent. Secrets come from ats-platform-secrets (see deployment.yml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-agent-config
  labels:
    app.kubernetes.io/name: ats-agent
data:
  APP_ENV: "DEV"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://ats-lgtm:4318"
  DEFAULT_SKILL_NAME: "ats_screening"
  DEFAULT_SKILL_VERSION: "v1"
  HISTORY_WINDOW: "12"
  HISTORY_ENTRIES: "20"
  ALLOWED_CALLERS: "ats-orchestrator"
  TOOL_POLICY: "ats-orchestrator=screen_candidate|ask_agent|cancel_request"
  DATABASE_NAME: "ats_platform"    # overrides the database name in the secret's database-url
