# Knowledge ingestion worker (process ats-knowledge-worker): claims queued episodes from Postgres and extracts them
# into the tenant graphs. Same image as ats-knowledge, different command; no Service (nobody calls it).
# Replicas: 1 here; with the KEDA component (deploy/k8s/keda) KEDA owns the count (0..N by queue length).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-knowledge-worker
  labels:
    app.kubernetes.io/name: ats-knowledge-worker
    app.kubernetes.io/component: knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-knowledge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-knowledge-worker
        app.kubernetes.io/component: knowledge
    spec:
      terminationGracePeriodSeconds: 600   # lets a running extraction finish; otherwise the lease retries it
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: ats-knowledge:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - ats_knowledge.worker
          envFrom:
            - configMapRef:
                name: ats-knowledge-config
            - configMapRef:
                name: ats-llm-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: database-url
            - name: LLM_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: ats-llm-gateway-secrets
                  key: master-key
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: falkordb-password
            - name: KNOWLEDGE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-platform-secrets
                  key: knowledge-redis-password
            - name: REDIS_URL
              value: "redis://:$(KNOWLEDGE_REDIS_PASSWORD)@ats-knowledge-redis:6379/0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
