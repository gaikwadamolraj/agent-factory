# The sandbox may only be called by the compute agent and may not open any connection itself (no egress at all,
# not even DNS), so code that runs in it cannot reach the cluster, the database or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ats-sandbox-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ats-sandbox
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ats-compute
      ports:
        - protocol: TCP
          port: 8080
  egress: []
