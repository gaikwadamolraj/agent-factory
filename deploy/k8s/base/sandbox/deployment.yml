# Code sandbox for the compute agent - Deployment + Service. Runs untrusted Python, so it holds nothing of value:
# no Secret, no ConfigMap with credentials, no service-account token; non-root, read-only root filesystem, all
# capabilities dropped; /work is a small in-memory tmpfs. network-policy.yml blocks all egress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-sandbox
  labels:
    app.kubernetes.io/name: ats-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ats-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ats-sandbox
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: ats-sandbox:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MAX_CONCURRENT_RUNS
              value: "4"
            - name: MEMORY_LIMIT_MB
              value: "256"
          readinessProbe:   # exec probes: the NetworkPolicy only admits ats-compute, not kubelet HTTP probes
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ats-sandbox
  labels:
    app.kubernetes.io/name: ats-sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ats-sandbox
  ports:
    - name: http
      port: 80
      targetPort: http
