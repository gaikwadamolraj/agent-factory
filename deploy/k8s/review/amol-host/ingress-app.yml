# ats-platform UI and Grafana on amol.rackspire.ai under /ats and /grafana (review before applying).
# Uses ats-platform's own middlewares; does not modify or depend on the amol middlewares.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ats-amol-app
  namespace: ats-platform
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "120"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      ats-platform-ats-security-headers@kubernetescrd,
      ats-platform-ats-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: amol.rackspire.ai
      http:
        paths:
          - path: /ats
            pathType: Prefix
            backend:
              service:
                name: ats-frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ats-amol-grafana
  namespace: ats-platform
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "120"
    traefik.ingress.kubernetes.io/router.middlewares: ats-platform-ats-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: amol.rackspire.ai
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: ats-lgtm
                port:
                  name: grafana
