[project]
name = "ats-knowledge"
version = "0.1.0"
description = "Shared knowledge-graph service: Graphiti on FalkorDB (graph per tenant) + Redis semantic cache, exposed over MCP"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ats-common[mcp,llm]",
    "graphiti-core[falkordb]>=0.31.2",
    "httpx>=0.27",
    "mcp>=2.0.0",
    "redisvl>=0.30.0",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
ats-common = { path = "../common", editable = false }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
