[project]
name = "ats-compute"
version = "0.1.0"
description = "ATS compute agent: executes Python code it is given in an isolated sandbox and returns the output as text; MCP server"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ats-common",
    "strands-agents>=1.60.0",          # only for the standard Sandbox interface
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
ats-common = { path = "../common", editable = false }

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
