[project]
name = "auth-service"
version = "0.1.0"
description = "ATS auth-service: user sign-in (httpOnly cookies, rotating refresh tokens), user management, ES256 tokens + JWKS, OAuth2 client_credentials for services"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agent-common[fastapi]",
    "bcrypt>=4.2",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
agent-common = { path = "../../common", editable = false }

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "aiosqlite>=0.20.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
