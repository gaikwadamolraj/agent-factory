[project]
name = "registry-service"
version = "0.1.0"
description = "Admin & authoring plane for the ATS platform: skills/versions/approvals, IAM policy & groups, delegated user/client/project admin, notifications and an MCP tool-catalogue proxy. One set of FastMCP tools, reached over MCP and over a hardened REST wrapper."
requires-python = ">=3.11,<3.13"
dependencies = [
    "agent-common[fastapi,mcp]",
    "mcp>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30.0",
    "redis>=5.0.3",
    "httpx>=0.27",
]

[tool.uv.sources]
agent-common = { path = "../../common", editable = false }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
