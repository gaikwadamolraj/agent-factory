[project]
name = "ats-common"
version = "0.1.0"
description = "Shared library for ATS services: config, logging/OTEL, error codes, resilience, tenancy, security, middleware"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "redis>=5.0.3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "starlette>=0.37",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-asgi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115", "python-multipart>=0.0.9"]
mcp = ["mcp>=1.10"]                       # ats_common.mcp_client + ats_common.knowledge.client
llm = ["openai>=1.40"]                     # ats_common.llm: gateway client, structured completions, embeddings

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_common"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
