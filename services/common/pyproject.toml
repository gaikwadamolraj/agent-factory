[project]
name = "agent-common"
version = "0.1.0"
description = "Shared library for ATS services: config, logging/OTEL, error codes, resilience, tenancy, token verification, middleware"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    # Pinned below 2.1: opentelemetry-instrumentation-sqlalchemy declares sqlalchemy<2.1.0 and silently skips
    # instrumenting anything newer, so every service logs a version warning at startup and loses its database
    # spans. Tracing a slow query matters more than being on the newest minor. Raise the ceiling when the
    # instrumentation supports 2.1.
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "redis>=5.0.3",
    "pyjwt[crypto]>=2.9",                  # ES256 verification of auth-service tokens (JWKS)
    "httpx>=0.27",                         # JWKS + client_credentials calls to the auth-service
    "starlette>=0.37",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-asgi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115", "python-multipart>=0.0.9"]
mcp = ["mcp>=1.10"]                       # agent_common.mcp_client + agent_common.knowledge.client
llm = ["openai>=1.40"]                     # agent_common.llm: gateway client, structured completions, embeddings
temporal = ["temporalio>=1.9"]             # agent_common.workflow: durable workflow client + worker runner

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.40",
    "temporalio>=1.9",                     # workflow wrapper checks run against the SDK test environment
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_common"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
